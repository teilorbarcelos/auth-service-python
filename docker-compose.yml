services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: auth_service_python_app
    ports:
      - "8001:8001"
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgrespw}@host.docker.internal:5432/${POSTGRES_DB:-backend_python}
      - JWT_SECRET=${JWT_SECRET:-local-development-secret-key}
      - ENVIRONMENT=production
      - LOG_LEVEL=warning
    extra_hosts:
      - "host.docker.internal:host-gateway"
